  <body class="min-h-dvh bg-[#ff65cc] bg-linear-to-t from-[#ff65cc] to-[#4b2b96] bg-fixed font-sans text-cream antialiased">
    <div class="mx-auto flex min-h-dvh w-full max-w-lg flex-col px-5 sm:px-8 lg:max-w-[40rem]">
      <main class="flex w-full flex-1 flex-col items-center gap-5 pt-6 pb-7 sm:pt-8 lg:gap-6 lg:pt-10">
        <header class="flex flex-col items-center gap-3 text-center lg:gap-4">
          <button id="profile-btn" type="button" aria-label="Spin Nesi's profile picture" class="cursor-pointer rounded-full focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-cream">
            <img class="size-20 select-none rounded-full border-3 border-cream object-cover sm:size-24 lg:size-28" id="pfp" src="/nesi.png" alt="NesiEXE's profile picture" width="96" height="96" draggable="false">

        </header>
        
        <p class="max-w-sm text-center text-sm leading-relaxed text-cream sm:text-base lg:max-w-lg lg:text-lg"><span id="age">:3</span> / gay / Networking nerd / sily / hug friendly</p>
        
        <section id="now-playing" aria-labelledby="music-heading" class="relative isolate w-full max-w-sm overflow-hidden rounded-xl border border-cream/30 bg-ink/90 p-3 mx-8 shadow-[0_0_18px_0_#ffffcd26] lg:max-w-md lg:p-3.5">
          <img id="album-background" alt="" aria-hidden="true" hidden class="absolute inset-0 -z-10 size-full scale-110 object-cover opacity-20 blur-md" draggable="false">
          <div class="flex items-center gap-3 lg:gap-4">
            <div class="flex size-12 shrink-0 items-center justify-center overflow-hidden rounded-lg border border-white/15 bg-white/10 lg:size-14">
              <span id="music-placeholder" aria-hidden="true" class="text-2xl text-mint">♫</span>
              <img id="album-art" alt="" hidden class="size-full object-cover" width="48" height="48" draggable="false">
            </div>
            <div class="min-w-0 flex-1">
              <h2 id="music-heading" class="mb-1 text-[0.6875rem] font-medium tracking-widest text-mint uppercase lg:text-xs">Now playing</h2>
              <div id="music-status" role="status" aria-live="polite" aria-atomic="true">
                <p id="music-message" class="text-sm leading-snug lg:text-base">Checking what I'm listening to…</p>
                <div id="track-details" hidden>
                  <a id="track-link" class="block rounded-sm text-sm leading-snug font-semibold wrap-anywhere underline decoration-mint/50 underline-offset-4 hover:text-mint focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-mint lg:text-base"></a>
                  <p id="track-artist" class="mt-1 text-xs leading-relaxed wrap-anywhere text-cream/85 lg:text-sm"></p>
                </div>
              </div>
            </div>
          </div>
        </section>

        <nav aria-label="Find Nesi online" class="w-full scroll-mt-6">
